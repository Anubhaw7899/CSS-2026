<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Properties</title>
</head>

<body>
    <!-- block -->
    <div style="background-color: red; width: 100px; height: 100px;">Block</div>
    <div style="background-color: green; width: 100px; height: 100px;">Block</div>
    <br><br>

    <!-- Inline , width and height not adjustable -->
    <span style="background-color: red; width: 100px; height: 100px;">Inline</span>
    <span style="background-color: green; width: 100px; height: 100px;">Inline</span>
    <!-- Inline-block -->
    <span style="background-color: red; width: 100px; height: 100px; display: inline-block;">Inline Block</span>
    <span style="background-color: green; width: 100px; height: 500px; display: inline-block;">Inline Block</span>
</body>

</html>

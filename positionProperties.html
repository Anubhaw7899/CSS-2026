<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Properties</title>
</head>

<body>
    <!-- Static, Relative, Absolute, Fixed -->
    <p>
        static - position in Normal flow <br>
        relative - position relative to elememnt's original(static) position <br>
        absolute - position relative to its nearest ancestor <br>
        Fixed - its position is fixed at a particualr position
    </p>

    <!-- Positioning (Static) -->
    <div style="background-color: red; width: 100px; height: 100px;">Static 1</div>
    <div style="background-color: green; width: 100px; height: 100px;">Static 2</div>

    <!-- Positioning ( Relative) -->
    <div style="width: auto; height: auto; background-color: aqua;">
        <div style="background-color: red; width: 100px; height: 100px; position: relative; left:50px;">Relative 1</div>
        <div style="background-color: green; width: 100px; height: 100px; position: relative; left: 30px;">Relative 2
        </div>
    </div>
    <!-- Positioning (Absolute) -->
    <div style="width: auto; height: 300px; background-color: rgb(63, 131, 247); position: relative;">
        <div style="background-color: red; width: 150px; height: 100px; position: absolute; left:50px; top: 20px;">Absolute 1</div>
        <div style="background-color: green; width: 150px; height: 100px; position: absolute; left: 400px;">Absolute 2
        </div>
    </div>
    <!-- Positioning (Fixed) -->
     <div style="background-color: rgba(122, 9, 3, 0.224); height: 50px; width: 50px; position: fixed; top: 0px; left: 100px;">Fixed 1</div>
</body>

</html>

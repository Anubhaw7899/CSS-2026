<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Element and Classes</title>
    <style>
        /* Pseudo Element and Pseudo Classes */
        .btn {
            background-color: #4CAF50; /* Green */
            border: none;
            color: white;
            /* padding: 15px 32px; */
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn:hover {
            background-color: #45a049; /* Darker green on hover */
            transform: scale(1.1); /* Slightly enlarge the button on hover */
        }

        .btn::after {
            content: ' →'; /* Add an arrow after the button text */
            opacity: 0; /* Initially invisible */
            transition: opacity 0.3s ease; /* Smooth transition for opacity */
        }

        .btn:hover::after {
            opacity: 1; /* Make the arrow visible on hover */
        }
        input:focus {
            outline: none; /* Remove default focus outline */
            border: 2px solid #4CAF50; /* Add a green border on focus */
            box-shadow: 0 0 5px #4CAF50; /* Add a subtle glow effect */
        }
        p::first-letter {
            font-size: 2em; /* Make the first letter larger */
            color: #4CAF50; /* Change its color */
            font-weight: bold; /* Make it bold */
            font-family: 'Arial', sans-serif; /* Change the font family */
            text-transform: uppercase; /* Make it uppercase */
        }

        :root {
            --main-color: #4CAF50; /* Define a CSS variable for the main color */
        }
        h1 {
            color: var(--main-color); /* Use the CSS variable for the color */
            font-family: 'Arial', sans-serif; /* Change the font family */
            text-align: center; /* Center the heading */
        }
</style>
</head>
<body>
    <!-- Pseudo Element and Pseudo Classes -->
     
     <input type="text"><button class="btn">Hover Me</button>
     <p>anubhaw singh <br> Anubhaw</p>
     <p>shital</p>
     <h1>CSS Variables</h1>

</body>
</html>

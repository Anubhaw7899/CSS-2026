<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curtain Reveal Transition Page</title>
    <style>
        /* 1. Global Reset & Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 2. Curtain Slide-In Effect Mechanics */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f43f5e; /* Vibrant curtain color */
            z-index: 10;
            transform: translateX(0);
            animation: curtainSlide 1s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @keyframes curtainSlide {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(100%);
            }
        }

        /* 3. Delayed Content Fade-In */
        @keyframes contentFade {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 4. New Horizontal Split Card Layout */
        .split-card {
            display: flex;
            background-color: #111827;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 650px;
            width: 90%;
            overflow: hidden;
            border: 1px solid #1f2937;
            
            /* Holds content invisible until the curtain clears past */
            opacity: 0;
            animation: contentFade 0.6s ease-out 0.4s forwards;
        }

        /* Left visual accent element */
        .card-accent {
            background: linear-gradient(135deg, #f43f5e, #be123c);
            width: 35%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        /* Right content zone */
        .card-body {
            padding: 2.5rem;
            width: 65%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        p {
            color: #9ca3af;
            margin-bottom: 1.75rem;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* 5. Button Hover Micro-Transitions */
        .btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            background-color: transparent;
            color: #f43f5e;
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            border: 2px solid #f43f5e;
            
            /* Smooth interpolation rules */
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: #f43f5e;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <main class="split-card">
        <div class="card-accent">✨</div>
        <div class="card-body">
            <h1>Curtain Reveal</h1>
            <p>This layout uses a pseudo-element overlay acting as a sliding partition blocker alongside a staggered entry animation delay for the actual card framework.</p>
            <a href="#" class="btn">Discover More</a>
        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position- Sticky</title>
</head>

<body>
    <!-- Parent Container - Clean and simple -->
    <div style="width: 300px; height: 300px; background-color: lightgray; overflow: scroll;">

        <!-- Sticky Child - Standard native behavior -->
        <div style="position: sticky; top: 0; background-color: green; color: white; z-index: 10;">
            I am sticky! I stay at the top of the gray box when you scroll.
        </div>

        <div style="height: 900px; background-color: aqua; text-align: center; padding-top: 80px;">
            <strong>Hello Anubhaw Singh</strong>
        </div>

        <div
            style="position: relative; background-color: crimson; color: white; padding: 15px; padding-top: 150px; border-radius: 5px; height: 2000px;">
            🚨 I am position: relative! Without z-index on the header, I would slide on top of it.
        </div>
    </div>

</body>

</html>

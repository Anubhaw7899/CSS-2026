<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position - Fixed</title>
</head>

<body>
    <!-- This bar will stay stuck at the top of the viewport -->
    <!-- <div style="position: fixed; top: 0; right:0; width: auto; height: 60px; background-color: #333; color: white;">
    I am a fixed header! I never move when you scroll.
</div> -->
    <!-- Extra content to allow page scrolling -->
    <!-- <div style="margin-top: 80px; height: 2000px; background: linear-gradient(orange, blue);">
    Scroll down to see the effect...
</div> -->


    <!-- Even if the parent <div> has position: relative;,
     an element with position: fixed will completely ignore it
      and fly straight to the browser viewport (the visible screen area) -->


    <!-- A small container box placed somewhere on the page -->
    <div style="position: relative; width: 300px; height: 2000px; padding-top: 50px; background-color: lightgray; margin-left: 100px;">
        I am a relative parent...

        <!-- This fixed child completely ignores the gray box! -->

        <div style="position: fixed; top: 0; left: 0; background-color: red; color: white;">
            I am pinned to the top-left of the entire browser window!
        </div>
    </div>




</body>

</html>
